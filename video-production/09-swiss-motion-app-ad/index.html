<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Rubik;src:url('assets/fonts/Rubik-Regular.ttf')}@font-face{font-family:Rubik;src:url('assets/fonts/Rubik-Medium.ttf');font-weight:500}@font-face{font-family:Rubik;src:url('assets/fonts/Rubik-SemiBold.ttf');font-weight:600}@font-face{font-family:Rubik;src:url('assets/fonts/Rubik-Bold.ttf');font-weight:700}
*{margin:0}html,body{width:100%;height:100%;overflow:hidden;background:#f3f2ed}canvas{width:100vw;height:100vh;display:block}
</style>
</head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,D=30,lang=new URLSearchParams(location.search).get('lang')||'sv';
const C={paper:'#f3f2ed',white:'#fffefa',ink:'#151515',grey:'#777873',grid:'#d9d8d2',orange:'#ef5a24',pale:'#e7e6e0'};
const TXT=lang==='ar'?{dir:'rtl',hook:'رحلة أم شحن؟',corridor:'السويد ↔ تونس',service:'شحن. نقل. تاكسي المطار.',serviceSub:'خدمات عملية في مكان واحد',route:'اطّلع على المسار',routeSub:'معلومات رحلتك في تطبيق واحد',status:'تابع رحلتك القادمة',statusSub:'تحديثات الرحلة — بكل وضوح',summary:'رحلات وخدمات في تطبيق واحد',cta:'استكشف التطبيق',brand:'تونيسكا ميغا',kicker:'خدمات بين السويد وتونس'}:{dir:'ltr',hook:'Resa eller frakt?',corridor:'Sverige ↔ Tunisien',service:'Frakt. Flytt. Flygtaxi.',serviceSub:'Praktiska tjänster på ett ställe',route:'Se resans rutt',routeSub:'Reseinformation samlad i appen',status:'Följ din nästa resa',statusSub:'Reseuppdateringar — tydligt samlade',summary:'Resor och tjänster i samma app',cta:'Utforska appen',brand:'Tunisiska Mega',kicker:'Tjänster mellan Sverige och Tunisien'};
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const imgs={services:new Image(),logo:new Image()};imgs.services.src=lang==='ar'?'assets/screens/services-ar.png':'assets/screens/services-sv.png';imgs.logo.src='assets/logo-mono.png';
const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)},clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function line(x1,y1,x2,y2,color=C.ink,w=2){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function text(s,x,y,size=52,weight=500,color=C.ink,align='left',rtl=false){ctx.save();ctx.direction=rtl?'rtl':'ltr';ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.font=`${weight} ${size}px Rubik,Arial,sans-serif`;ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.restore()}
function track(t,a,b){return ease((t-a)/(b-a))}
function reveal(x,y,w,h,p){ctx.save();ctx.beginPath();ctx.rect(x,y,w*clamp(p),h);ctx.clip()}
function grid(){rect(0,0,W,H,C.paper);for(let i=0;i<8;i++){let x=72+i*132;rect(x,90,1,1740,C.grid)}for(let y=120;y<1830;y+=120)rect(72,y,936,1,'#e6e5df');}
function header(n,label,rtl){text(n,72,118,24,600,C.orange);text(label,1008,118,22,500,C.grey,'right',rtl);line(72,148,1008,148,C.ink,2)}
function runLine(x1,y1,x2,y2,p){line(x1,y1,x1+(x2-x1)*p,y1+(y2-y1)*p,C.orange,8);if(p>.98){ctx.fillStyle=C.orange;ctx.beginPath();ctx.arc(x2,y2,11,0,Math.PI*2);ctx.fill()}}
function imageContain(img,x,y,w,h){if(!img.complete||!img.naturalWidth)return;let s=Math.min(w/img.naturalWidth,h/img.naturalHeight),iw=img.naturalWidth*s,ih=img.naturalHeight*s;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
function screenshotCard(x,y,w,h,p){ctx.save();ctx.beginPath();ctx.rect(x,y,w*p,h);ctx.clip();rect(x,y,w,h,C.white);if(imgs.services.complete){let iw=imgs.services.naturalWidth,ih=imgs.services.naturalHeight,scale=Math.min(w/iw,h/ih);let dw=iw*scale,dh=ih*scale;ctx.drawImage(imgs.services,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}ctx.restore();line(x,y+h,x+w,y+h,C.ink,2)}
function routeGraphic(t,rtl){let p=track(t,9.2,12.4),x0=rtl?860:220,x1=rtl?220:860,y=935;line(180,730,900,730,C.grid,3);runLine(x0,y,x1,y,p);ctx.fillStyle=C.ink;for(let [x,l] of [[x0,rtl?'السويد':'SVERIGE'],[x1,rtl?'تونس':'TUNISIEN']]){ctx.beginPath();ctx.arc(x,y,16,0,7);ctx.fill();text(l,x,y+76,25,600,C.ink,'center',rtl)}for(let i=0;i<5;i++){let xx=240+i*150;rect(xx,690,2,80,C.grid)} }
function statusTicket(t,rtl){let p=track(t,14.0,15.0),x=120+30*(1-p),y=720,w=840,h=525;rect(x,y,w,h,C.white);line(x,y,x+w,y,C.ink,3);text(rtl?'حالة الرحلة':'RESESTATUS',rtl?x+w-56:x+56,y+86,22,600,C.grey,rtl?'right':'left',rtl);text(rtl?'متابعة مباشرة':'LIVE STATUS',rtl?x+w-56:x+56,y+180,48,700,C.ink,rtl?'right':'left',rtl);line(x+56,y+220,x+w-56,y+220,C.grid,2);for(let i=0;i<3;i++){let yy=y+290+i*74;rect(rtl?x+w-56-210:x+56,yy,210,16,i===0?C.orange:C.pale);rect(rtl?x+56:x+w-56-300,yy+2,240,11,C.grid)}line(x+56,y+h-56,x+w-56,y+h-56,C.ink,2)}
function cards(t,rtl){let p=track(t,19.2,20.4);let x0=rtl?880:200,dir=rtl?-1:1;for(let i=0;i<3;i++){let x=x0+dir*i*260,y=750,w=210,h=560,sc=(i===0?imgs.services:null);rect(x,y,w,h,C.white);line(x,y,x+w,y,C.ink,2);if(i===0&&sc&&sc.complete){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h*p);ctx.clip();let iw=sc.naturalWidth,ih=sc.naturalHeight,s=Math.max(w/iw,h/ih);ctx.drawImage(sc,x+(w-iw*s)/2,y+(h-ih*s)/2,iw*s,ih*s);ctx.restore()}else if(i>0){let yy=y+150;line(x+30,yy,x+w-30,yy,i===2?C.orange:C.ink,4);for(let k=0;k<3;k++)rect(x+30,yy+60+k*72,w-60-(k%2)*45,12,C.pale);if(i===1){line(x+35,y+350,x+w-35,y+350,C.orange,4);ctx.fillStyle=C.orange;ctx.beginPath();ctx.arc(x+w/2,y+350,8,0,7);ctx.fill()}}} }
function draw(t){grid();let rtl=TXT.dir==='rtl';ctx.save();if(t<4){header('01',TXT.kicker,rtl);let p=track(t,.2,1.2);runLine(rtl?880:200,650,rtl?200:880,650,p);reveal(72,870,936,150,p);text(TXT.hook,rtl?1008:72,980,105,700,C.ink,rtl?'right':'left',rtl);ctx.restore();reveal(rtl?72:72,1110,936,64,track(t,.5,1.4));text(TXT.corridor,rtl?1008:72,1170,44,500,C.grey,rtl?'right':'left',rtl);ctx.restore();return}
if(t<9){header('02',TXT.kicker,rtl);text(TXT.service,rtl?1008:72,300,64,700,C.ink,rtl?'right':'left',rtl);text(TXT.serviceSub,rtl?1008:72,365,26,500,C.grey,rtl?'right':'left',rtl);screenshotCard(160,460,760,1120,track(t,4.1,5.1));runLine(rtl?900:180,1640,rtl?180:900,1640,track(t,7.2,8.2));ctx.restore();return}
if(t<14){header('03',TXT.kicker,rtl);text(TXT.route,rtl?1008:72,300,64,700,C.ink,rtl?'right':'left',rtl);text(TXT.routeSub,rtl?1008:72,365,26,500,C.grey,rtl?'right':'left',rtl);routeGraphic(t,rtl);text(rtl?'معلومات الرحلة':'RESEINFORMATION',rtl?1008:72,1260,24,600,C.grey,rtl?'right':'left',rtl);ctx.restore();return}
if(t<20){header('04',TXT.kicker,rtl);text(TXT.status,rtl?1008:72,300,64,700,C.ink,rtl?'right':'left',rtl);text(TXT.statusSub,rtl?1008:72,365,26,500,C.grey,rtl?'right':'left',rtl);statusTicket(t,rtl);runLine(rtl?860:220,1400,rtl?220:860,1400,track(t,17.4,18.4));ctx.restore();return}
if(t<25){header('05',TXT.kicker,rtl);cards(t,rtl);text(TXT.summary,rtl?1008:72,1450,46,700,C.ink,rtl?'right':'left',rtl);line(72,1515,1008,1515,C.orange,8);ctx.restore();return}
header('06',TXT.kicker,rtl);line(72,430,1008,430,C.orange,8);imageContain(imgs.logo,235,585,610,420);text(TXT.brand,rtl?1008:72,1200,35,500,C.grey,rtl?'right':'left',rtl);text(TXT.cta,rtl?1008:72,1360,76,700,C.ink,rtl?'right':'left',rtl);line(72,1440,72+936*track(t,25.2,26.3),1440,C.orange,8);text(TXT.corridor,72,1770,22,500,C.grey,'left',rtl);text(TXT.brand,1008,1770,22,600,C.ink,'right',rtl);ctx.restore();}
window.DUR=D;window.render=t=>draw(Math.max(0,Math.min(D,t)));window.READY=false;Promise.all([document.fonts.load('700 64px Rubik'),...Object.values(imgs).map(im=>new Promise(r=>{im.onload=r;im.onerror=r}))]).then(()=>window.READY=true);window.EV=[];
window.TEXTS=t=>{const a=[],rtl=TXT.dir==='rtl';if(t<4){if(t>=1.2)a.push({id:'hook',text:TXT.hook,x0:72,y0:840,x1:1008,y1:1000});if(t>=1.4)a.push({id:'corridor',text:TXT.corridor,x0:72,y0:1100,x1:1008,y1:1190})}else if(t<9){a.push({id:'service-title',text:TXT.service,x0:72,y0:220,x1:1008,y1:320},{id:'service-sub',text:TXT.serviceSub,x0:72,y0:330,x1:1008,y1:390})}else if(t<14){a.push({id:'route-title',text:TXT.route,x0:72,y0:220,x1:1008,y1:320},{id:'route-sub',text:TXT.routeSub,x0:72,y0:330,x1:1008,y1:390},{id:'route-labels',text:rtl?'السويد تونس':'SVERIGE TUNISIEN',x0:100,y0:880,x1:980,y1:1050})}else if(t<20){a.push({id:'status-title',text:TXT.status,x0:72,y0:220,x1:1008,y1:320},{id:'status-sub',text:TXT.statusSub,x0:72,y0:330,x1:1008,y1:390});if(t>=15)a.push({id:'status-label',text:rtl?'متابعة مباشرة':'LIVE STATUS',x0:150,y0:830,x1:930,y1:960})}else if(t<25){if(t>=20.4)a.push({id:'summary',text:TXT.summary,x0:72,y0:1390,x1:1008,y1:1480})}else {a.push({id:'cta',text:TXT.cta,x0:72,y0:1280,x1:1008,y1:1390})}return a};
</script></body></html>
